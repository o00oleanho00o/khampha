[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; XIAO ESP32S3 uses OPI PSRAM.
board_build.arduino.memory_type = qio_opi

; Keep the LDF on chain mode. WebSockets has platform-specific conditional
; includes and deep+/chain+ can incorrectly resolve ESP32 framework headers.
lib_deps =
    bblanchon/ArduinoJson
    https://github.com/pschatzmann/arduino-audio-tools.git

lib_ldf_mode = chain

; audio-tools 1.2.x uses C++17 inline variables.
build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Iinclude
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
